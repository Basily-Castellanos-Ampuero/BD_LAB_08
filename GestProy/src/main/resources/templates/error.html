<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Error')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
  <div class="alert alert-danger">
    <h4 class="alert-heading">Ocurrió un error</h4>
    <p th:text="${mensaje} ?: 'Error inesperado en la aplicación.'">Mensaje de error</p>
  </div>
  <a th:href="@{/}" class="btn btn-secondary">Volver al inicio</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

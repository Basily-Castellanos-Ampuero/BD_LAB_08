<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Clientes')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
  <div th:replace="~{fragments/mensajes :: alertas}"></div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Clientes</h1>
    <a th:if="${admin}" th:href="@{/clientes/nuevo}" class="btn btn-primary">Adicionar</a>
  </div>

  <table class="table table-striped table-hover tabla-mantenimiento">
    <thead>
      <tr>
        <th>Código</th>
        <th>Nombre / Razón social</th>
        <th>Tipo</th>
        <th>Estado cliente</th>
        <th>Ingreso</th>
        <th>Últ. proy. cerrado</th>
        <th>Estado</th>
        <th class="text-end">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr th:if="${#lists.isEmpty(clientes)}">
        <td colspan="8" class="text-center text-muted">Sin registros</td>
      </tr>
      <tr th:each="c : ${clientes}">
        <td th:text="${c.cod}">1001</td>
        <td th:text="${c.nom}">Nombre</td>
        <td th:text="${c.tipDes}">Tipo</td>
        <td th:text="${c.estDes}">Estado</td>
        <td th:text="${c.fecIng}">2026-01-01</td>
        <td th:text="${c.fecUltProCer} ?: '—'">—</td>
        <td><th:block th:replace="~{fragments/estado-badge :: badge(${c.estReg})}"/></td>
        <td class="text-end">
          <th:block th:if="${admin}">
            <a th:href="@{/clientes/{c}/editar(c=${c.cod})}" class="btn btn-sm btn-outline-primary">Modificar</a>
            <form th:if="${c.estReg == 'A'}" class="d-inline"
                  th:action="@{/clientes/{c}/inactivar(c=${c.cod})}" method="post">
              <button class="btn btn-sm btn-outline-warning">Inactivar</button>
            </form>
            <form th:if="${c.estReg != 'A'}" class="d-inline"
                  th:action="@{/clientes/{c}/reactivar(c=${c.cod})}" method="post">
              <button class="btn btn-sm btn-outline-success">Reactivar</button>
            </form>
            <form th:if="${c.estReg != '*'}" class="d-inline"
                  th:action="@{/clientes/{c}/eliminar(c=${c.cod})}" method="post"
                  onsubmit="return confirm('¿Eliminar (lógicamente) este cliente?');">
              <button class="btn btn-sm btn-outline-danger">Eliminar</button>
            </form>
          </th:block>
        </td>
      </tr>
    </tbody>
  </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

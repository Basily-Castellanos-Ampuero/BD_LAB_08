<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Iniciar sesión')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container" style="max-width: 420px">
  <div th:replace="~{fragments/mensajes :: alertas}"></div>

  <h1 class="mb-4">Iniciar sesión</h1>
  <p class="text-muted">Solo la cuenta de administración puede modificar datos. El resto del sistema es visible sin iniciar sesión.</p>

  <form method="post" th:action="@{/login}">
    <div class="mb-3">
      <label class="form-label">Usuario</label>
      <input type="text" name="login" class="form-control" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label">Contraseña</label>
      <input type="password" name="password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">Ingresar</button>
    <a th:href="@{/}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${tabla.etiqueta})}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
  <div th:replace="~{fragments/mensajes :: alertas}"></div>

  <h1 th:text="(${esEdicion} ? 'Modificar ' : 'Adicionar ') + ${tabla.etiqueta}">Formulario</h1>

  <form class="form-mantenimiento mt-3" method="post"
        th:action="${esEdicion}
                   ? @{/referenciales/{t}/{c}(t=${tabla.slug},c=${registro.cod})}
                   : @{/referenciales/{t}(t=${tabla.slug})}"
        th:object="${registro}">

    <div class="mb-3">
      <label class="form-label">Código</label>
      <!-- la PK no se modifica: en edición el campo va bloqueado -->
      <input th:field="*{cod}" class="form-control" th:readonly="${esEdicion}"
             th:type="${tabla.codNumerico} ? 'number' : 'text'" required>
    </div>

    <div class="mb-3">
      <label class="form-label" th:text="${tabla.name() == 'LIN_PRO'} ? 'Nombre' : 'Descripción'">Descripción</label>
      <input th:field="*{des}" class="form-control" maxlength="60" required>
    </div>

    <div class="mb-3" th:if="${tabla.tieneTam}">
      <label class="form-label">Tamaño</label>
      <select th:field="*{tam}" class="form-select" required>
        <option value="P">P — Pequeño</option>
        <option value="M">M — Mediano</option>
        <option value="G">G — Grande</option>
      </select>
    </div>

    <div class="mb-3" th:if="${tabla.tieneTieEst}">
      <label class="form-label">Horas estimadas</label>
      <input th:field="*{tieEst}" class="form-control" type="number" step="0.25" min="0.25" required>
    </div>

    <button type="submit" class="btn btn-success">Actualizar</button>
    <a th:href="@{/referenciales/{t}(t=${tabla.slug})}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

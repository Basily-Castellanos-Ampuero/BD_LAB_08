<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${tabla.etiquetaPlural})}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
  <div th:replace="~{fragments/mensajes :: alertas}"></div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 th:text="${tabla.etiquetaPlural}">Catálogo</h1>
    <a th:if="${admin}" th:href="@{/referenciales/{t}/nuevo(t=${tabla.slug})}" class="btn btn-primary">Adicionar</a>
  </div>

  <table class="table table-striped table-hover tabla-mantenimiento">
    <thead>
      <tr>
        <th>Código</th>
        <th th:text="${tabla.name() == 'LIN_PRO'} ? 'Nombre' : 'Descripción'">Descripción</th>
        <th th:if="${tabla.tieneTam}">Tamaño</th>
        <th th:if="${tabla.tieneTieEst}">Horas estimadas</th>
        <th>Estado</th>
        <th class="text-end">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr th:if="${#lists.isEmpty(registros)}">
        <td colspan="6" class="text-center text-muted">Sin registros</td>
      </tr>
      <tr th:each="r : ${registros}">
        <td th:text="${r.cod}">1</td>
        <td th:text="${r.des}">Descripción</td>
        <td th:if="${tabla.tieneTam}" th:text="${r.tam}">M</td>
        <td th:if="${tabla.tieneTieEst}" th:text="${r.tieEst}">0</td>
        <td><th:block th:replace="~{fragments/estado-badge :: badge(${r.estReg})}"/></td>
        <td class="text-end">
          <th:block th:if="${admin}">
            <a th:href="@{/referenciales/{t}/{c}/editar(t=${tabla.slug},c=${r.cod})}"
               class="btn btn-sm btn-outline-primary">Modificar</a>
            <form th:if="${r.estReg == 'A'}" class="d-inline"
                  th:action="@{/referenciales/{t}/{c}/inactivar(t=${tabla.slug},c=${r.cod})}" method="post">
              <button class="btn btn-sm btn-outline-warning">Inactivar</button>
            </form>
            <form th:if="${r.estReg != 'A'}" class="d-inline"
                  th:action="@{/referenciales/{t}/{c}/reactivar(t=${tabla.slug},c=${r.cod})}" method="post">
              <button class="btn btn-sm btn-outline-success">Reactivar</button>
            </form>
            <form th:if="${r.estReg != '*'}" class="d-inline"
                  th:action="@{/referenciales/{t}/{c}/eliminar(t=${tabla.slug},c=${r.cod})}" method="post"
                  onsubmit="return confirm('¿Eliminar (lógicamente) este registro?');">
              <button class="btn btn-sm btn-outline-danger">Eliminar</button>
            </form>
          </th:block>
        </td>
      </tr>
    </tbody>
  </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

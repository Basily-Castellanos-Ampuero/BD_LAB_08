<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Proyecto')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
  <div th:replace="~{fragments/mensajes :: alertas}"></div>

  <h1 th:text="${esEdicion} ? 'Modificar Proyecto' : 'Crear Proyecto'">Proyecto</h1>
  <p class="text-muted" th:unless="${esEdicion}">
    La secuencia del proyecto la calcula la base de datos (proyecto N de este tipo para este cliente).
  </p>

  <form class="mt-3" style="max-width: 760px" method="post"
        th:action="${esEdicion}
                   ? @{/proyectos/{c}/{t}/{s}(c=${proyecto.cliCod},t=${proyecto.tipCod},s=${proyecto.sec})}
                   : @{/proyectos}"
        th:object="${proyecto}">

    <!-- En edición la PK (cliente, tipo, sec) no cambia -->
    <div class="row" th:unless="${esEdicion}">
      <div class="col-md-6 mb-3">
        <label class="form-label">Cliente</label>
        <select th:field="*{cliCod}" class="form-select" required>
          <option value="">— Seleccione —</option>
          <option th:each="c : ${clientesActivos}" th:value="${c.cod}"
                  th:text="${c.cod} + ' — ' + ${c.nom}"></option>
        </select>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Tipo de proyecto</label>
        <select th:field="*{tipCod}" class="form-select" required>
          <option value="">— Seleccione —</option>
          <option th:each="t : ${tiposProyecto}" th:value="${t.cod}"
                  th:text="${t.cod} + ' — ' + ${t.des}"></option>
        </select>
      </div>
    </div>
    <div class="alert alert-secondary" th:if="${esEdicion}">
      Proyecto <strong th:text="${proyecto.cliCod} + '-' + ${proyecto.tipCod} + '-' + ${proyecto.sec}">1001-1-1</strong>
      — <span th:text="${proyecto.clienteNombre}">Cliente</span> /
      <span th:text="${proyecto.tipoDescripcion}">Tipo</span>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Fecha de contrato</label>
        <input th:field="*{fecCon}" type="date" class="form-control">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Fecha pactada de entrega</label>
        <input th:field="*{fecPac}" type="date" class="form-control">
      </div>
    </div>

    <div class="row" th:if="${esEdicion}">
      <div class="col-md-6 mb-3">
        <label class="form-label">Fecha de inicio</label>
        <input th:field="*{fecIni}" type="date" class="form-control">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Fecha de entrega real</label>
        <input th:field="*{fecEnt}" type="date" class="form-control">
      </div>
    </div>

    <h5 class="mt-2">Montos presupuestados (S/)</h5>
    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label">Monto (ingreso)</label>
        <input th:field="*{monPre}" type="number" step="0.01" min="0" class="form-control">
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Costo</label>
        <input th:field="*{cosPre}" type="number" step="0.01" min="0" class="form-control">
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Gasto</label>
        <input th:field="*{gasPre}" type="number" step="0.01" min="0" class="form-control">
      </div>
    </div>

    <th:block th:if="${esEdicion}">
      <h5 class="mt-2">Montos reales (S/)</h5>
      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="form-label">Monto (ingreso)</label>
          <input th:field="*{monRea}" type="number" step="0.01" min="0" class="form-control">
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">Costo</label>
          <input th:field="*{cosRea}" type="number" step="0.01" min="0" class="form-control">
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">Gasto</label>
          <input th:field="*{gasRea}" type="number" step="0.01" min="0" class="form-control">
        </div>
      </div>
    </th:block>

    <p class="text-muted">La utilidad (monto − costo − gasto) la calcula automáticamente la base de datos.</p>

    <button type="submit" class="btn btn-success">Actualizar</button>
    <a th:href="@{/proyectos}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Proyectos')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
  <div th:replace="~{fragments/mensajes :: alertas}"></div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Proyectos</h1>
    <a th:if="${admin}" th:href="@{/proyectos/nuevo}" class="btn btn-primary">Crear proyecto</a>
  </div>

  <table class="table table-striped table-hover tabla-mantenimiento">
    <thead>
      <tr>
        <th>Proyecto</th>
        <th>Cliente</th>
        <th>Tipo</th>
        <th>Estado</th>
        <th>Inicio</th>
        <th>Entrega</th>
        <th>Utilidad ppto.</th>
        <th>Registro</th>
        <th class="text-end">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr th:if="${#lists.isEmpty(proyectos)}">
        <td colspan="9" class="text-center text-muted">Sin proyectos</td>
      </tr>
      <tr th:each="p : ${proyectos}">
        <td>
          <a th:href="@{/proyectos/{c}/{t}/{s}(c=${p.cliCod},t=${p.tipCod},s=${p.sec})}"
             th:text="${p.cliCod} + '-' + ${p.tipCod} + '-' + ${p.sec}">1001-1-1</a>
        </td>
        <td th:text="${p.clienteNombre}">Cliente</td>
        <td th:text="${p.tipoDescripcion}">Tipo</td>
        <td><span class="badge bg-info text-dark" th:text="${p.estadoDescripcion}">Estado</span></td>
        <td th:text="${p.fecIni} ?: '—'">—</td>
        <td th:text="${p.fecEnt} ?: '—'">—</td>
        <td th:text="${p.utiPre != null} ? ${#numbers.formatDecimal(p.utiPre, 1, 2)} : '—'">—</td>
        <td><th:block th:replace="~{fragments/estado-badge :: badge(${p.estReg})}"/></td>
        <td class="text-end">
          <a th:href="@{/proyectos/{c}/{t}/{s}(c=${p.cliCod},t=${p.tipCod},s=${p.sec})}"
             class="btn btn-sm btn-outline-secondary">Detalle</a>
          <a th:href="@{/proyectos/{c}/{t}/{s}/equipo(c=${p.cliCod},t=${p.tipCod},s=${p.sec})}"
             class="btn btn-sm btn-outline-primary">Equipo</a>
          <a th:href="@{/proyectos/{c}/{t}/{s}/avance(c=${p.cliCod},t=${p.tipCod},s=${p.sec})}"
             class="btn btn-sm btn-outline-success">Avance</a>
        </td>
      </tr>
    </tbody>
  </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Personal')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
  <div th:replace="~{fragments/mensajes :: alertas}"></div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Personal</h1>
    <a th:if="${admin}" th:href="@{/personal/nuevo}" class="btn btn-primary">Adicionar</a>
  </div>

  <table class="table table-striped table-hover tabla-mantenimiento">
    <thead>
      <tr>
        <th>Código</th>
        <th>Nombre</th>
        <th>Cargo</th>
        <th>Costo/hora</th>
        <th>Ingreso</th>
        <th>Estado</th>
        <th class="text-end">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr th:if="${#lists.isEmpty(personal)}">
        <td colspan="7" class="text-center text-muted">Sin registros</td>
      </tr>
      <tr th:each="p : ${personal}">
        <td th:text="${p.cod}">2001</td>
        <td th:text="${p.nom}">Nombre</td>
        <td th:text="${p.carDes}">Cargo</td>
        <td th:text="${#numbers.formatDecimal(p.cosHor, 1, 2)}">50.00</td>
        <td th:text="${p.fecIng}">2026-01-01</td>
        <td><th:block th:replace="~{fragments/estado-badge :: badge(${p.estReg})}"/></td>
        <td class="text-end">
          <a th:href="@{/personal/{c}/cargos(c=${p.cod})}" class="btn btn-sm btn-outline-secondary">Cargos</a>
          <th:block th:if="${admin}">
            <a th:href="@{/personal/{c}/editar(c=${p.cod})}" class="btn btn-sm btn-outline-primary">Modificar</a>
            <form th:if="${p.estReg == 'A'}" class="d-inline"
                  th:action="@{/personal/{c}/inactivar(c=${p.cod})}" method="post">
              <button class="btn btn-sm btn-outline-warning">Inactivar</button>
            </form>
            <form th:if="${p.estReg != 'A'}" class="d-inline"
                  th:action="@{/personal/{c}/reactivar(c=${p.cod})}" method="post">
              <button class="btn btn-sm btn-outline-success">Reactivar</button>
            </form>
            <form th:if="${p.estReg != '*'}" class="d-inline"
                  th:action="@{/personal/{c}/eliminar(c=${p.cod})}" method="post"
                  onsubmit="return confirm('¿Eliminar (lógicamente) este personal?');">
              <button class="btn btn-sm btn-outline-danger">Eliminar</button>
            </form>
          </th:block>
        </td>
      </tr>
    </tbody>
  </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

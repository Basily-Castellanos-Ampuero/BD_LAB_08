<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Cargos de ' + ${persona.nom})}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
  <div th:replace="~{fragments/mensajes :: alertas}"></div>

  <h1>Cargos de proyecto autorizados</h1>
  <p class="text-muted">
    Persona: <strong th:text="${persona.cod} + ' — ' + ${persona.nom}">2001 — Nombre</strong>
    (cargo de planilla: <span th:text="${persona.carDes}">Cargo</span>)
  </p>

  <div class="row">
    <div class="col-md-7">
      <table class="table table-striped tabla-mantenimiento">
        <thead>
          <tr>
            <th>Cargo de proyecto</th>
            <th>Estado</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${#lists.isEmpty(cargos)}">
            <td colspan="3" class="text-center text-muted">Sin cargos autorizados</td>
          </tr>
          <tr th:each="c : ${cargos}">
            <td th:text="${c.carProCod} + ' — ' + ${c.carProDes}">1 — Cargo</td>
            <td><th:block th:replace="~{fragments/estado-badge :: badge(${c.estReg})}"/></td>
            <td class="text-end">
              <th:block th:if="${admin}">
                <form th:if="${c.estReg == 'A'}" class="d-inline"
                      th:action="@{/personal/{p}/cargos/{c}/inactivar(p=${persona.cod},c=${c.carProCod})}" method="post">
                  <button class="btn btn-sm btn-outline-warning">Inactivar</button>
                </form>
                <form th:if="${c.estReg != 'A'}" class="d-inline"
                      th:action="@{/personal/{p}/cargos/{c}/reactivar(p=${persona.cod},c=${c.carProCod})}" method="post">
                  <button class="btn btn-sm btn-outline-success">Reactivar</button>
                </form>
                <form th:if="${c.estReg != '*'}" class="d-inline"
                      th:action="@{/personal/{p}/cargos/{c}/eliminar(p=${persona.cod},c=${c.carProCod})}" method="post"
                      onsubmit="return confirm('¿Eliminar (lógicamente) esta autorización?');">
                  <button class="btn btn-sm btn-outline-danger">Eliminar</button>
                </form>
              </th:block>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="col-md-5" th:if="${admin}">
      <div class="card">
        <div class="card-header">Autorizar nuevo cargo</div>
        <div class="card-body">
          <form th:action="@{/personal/{p}/cargos(p=${persona.cod})}" method="post">
            <div class="mb-3">
              <label class="form-label">Cargo de proyecto</label>
              <select name="carProCod" class="form-select" required>
                <option value="">— Seleccione —</option>
                <option th:each="c : ${cargosProyecto}" th:value="${c.cod}"
                        th:text="${c.cod} + ' — ' + ${c.des}"></option>
              </select>
            </div>
            <button type="submit" class="btn btn-success">Actualizar</button>
            <a th:href="@{/personal}" class="btn btn-secondary">Cancelar</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

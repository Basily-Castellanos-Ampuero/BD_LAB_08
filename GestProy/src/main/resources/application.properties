# ============================================================
#  GestProy — configuración de la aplicación
#  Las credenciales de BD NO van aquí: se cargan desde
#  ./db.properties (gitignored; plantilla en db.properties.example)
# ============================================================
spring.application.name=GestProy
server.port=8080

# Credenciales locales (url, usuario, contraseña del datasource)
spring.config.import=optional:file:./db.properties
spring.datasource.driver-class-name=org.postgresql.Driver

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Logging
logging.level.edu.unsa.eps.gestproy=DEBUG

# JWT de la cuenta admin única (app.jwt.secret vive en db.properties, gitignored).
# access-minutos: vida del access token (autoriza escrituras).
# refresh-dias: vida del refresh token (solo renueva el access token en silencio).
# cookie-secure: false en desarrollo (http://localhost); poner true en producción con HTTPS.
app.jwt.access-minutos=15
app.jwt.refresh-dias=7
app.jwt.cookie-secure=false
